[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quantforge"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = ["pyarrow>=15,<27", "tzdata", "numpy>=2,<3"]
description = "Deterministic single-asset OHLCV strategy simulator"

[project.optional-dependencies]
research = ["matplotlib==3.10.8", "numpy==2.3.5", "pandas==2.2.3"]
dev = ["pytest>=8", "hypothesis>=6", "mypy>=1.10", "ruff>=0.8", "pytest-cov>=5"]

[project.scripts]
quantforge = "quantforge.cli:main"

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
module = ["pyarrow.*"]
ignore_missing_imports = true
